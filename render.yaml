services:
  - type: web
    name: gasflaretracker-web
    runtime: python
    region: frankfurt
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gasflaretracker-db
          property: connectionString
      - key: FIRMS_MAP_KEY
        sync: false

databases:
  - name: gasflaretracker-db
    databaseName: gasflaretracker
    user: gasflaretracker
    region: frankfurt
