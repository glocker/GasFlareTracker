<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GasFlareTracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="js/components/facility-card/facility-card.css" />
  <link rel="stylesheet" href="js/components/event-feed/event-feed.css" />
</head>
<body>
  <facility-map></facility-map>
  <facility-card></facility-card>
  <event-feed></event-feed>

  <!-- Native import map: "#app/foo.js" resolves to "/js/foo.js" from anywhere,
       regardless of how deep a component is nested under js/components/. Must
       come before the first module script that uses it. -->
  <script type="importmap">
    { "imports": { "#app/": "/js/" } }
  </script>

  <!-- UMD build: exposes the global `maplibregl`, loaded before our module -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
